<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rock Paper Scissors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- Screen 1: choose a mode -->
    <section id="menu-screen" class="screen active">
      <h1>Rock Paper Scissors</h1>
      <p class="subtitle">Choose how you want to play.</p>
      <div class="menu">
        <button class="mode-btn" id="mode-computer">
          <span class="mode-icon">🤖</span>
          <span class="mode-title">You vs Computer</span>
          <span class="mode-desc">Play against the computer</span>
        </button>
        <button class="mode-btn" id="mode-friend" disabled>
          <span class="mode-icon">👥</span>
          <span class="mode-title">Two Players</span>
          <span class="mode-desc">Coming soon</span>
        </button>
      </div>
    </section>

    <!-- Screen 2: You vs Computer -->
    <section id="game-screen" class="screen">
      <header class="game-header">
        <button class="link-btn" id="back-btn">&larr; Menu</button>
        <h2>You vs Computer</h2>
        <button class="link-btn" id="reset-btn">Reset score</button>
      </header>

      <div class="scoreboard">
        <div class="score"><span class="score-label">You</span><span class="score-value" id="score-player">0</span></div>
        <div class="score"><span class="score-label">Draws</span><span class="score-value" id="score-draw">0</span></div>
        <div class="score"><span class="score-label">Computer</span><span class="score-value" id="score-computer">0</span></div>
      </div>

      <div class="arena">
        <div class="hand-box">
          <div class="hand" id="player-hand">❔</div>
          <span class="hand-name">You</span>
        </div>
        <span class="vs">VS</span>
        <div class="hand-box">
          <div class="hand" id="computer-hand">❔</div>
          <span class="hand-name">Computer</span>
        </div>
      </div>

      <p class="result" id="result" aria-live="polite">Pick your move</p>

      <div class="choices">
        <button class="choice" data-choice="rock"><span>✊</span>Rock</button>
        <button class="choice" data-choice="paper"><span>✋</span>Paper</button>
        <button class="choice" data-choice="scissors"><span>✌️</span>Scissors</button>
      </div>
      <p class="hint">Tip: press R, P or S on your keyboard.</p>
    </section>

  </main>
  <script src="script.js"></script>
</body>
</html>
